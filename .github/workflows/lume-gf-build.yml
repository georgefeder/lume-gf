name: Lume GF build
run-name: Lume GF ${{ inputs.tag }} (${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Lume release tag to build (e.g. v2.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: lume-gf-build
  cancel-in-progress: false

jobs:
  # Guide logic (swift test) and Lume's whole unit test target with our changes, on the iOS Simulator. Both TestFlight
  # legs wait for this job: a failing test stops the upload for iPhone/iPad and Apple TV alike.
  tests:
    name: Tests before upload
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Our changes
        uses: actions/checkout@v5
        with:
          path: gf

      - name: Our script tests
        run: |
          python3 -m unittest discover -s gf/ci -p 'test_*.py'
          sh gf/ci/test_patch_scripts.sh
          sh gf/ci/test_sign_local.sh
          sh gf/ci/test_check_export.sh
          sh gf/ci/test_keepalive.sh
          sh gf/ci/test_add_sources.sh
          sh gf/ci/test_apply_patches.sh
          sh gf/ci/test_workflows.sh
          sh gf/ci/test_apply_dep_patches.sh

      - name: Lume ${{ inputs.tag }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/Lume
          ref: ${{ inputs.tag }}
          path: Lume

      - name: Engine version paired with this release
        id: engine
        # two lines on purpose: inside `echo "...$(...)"` a failing engine-ref.sh would be ignored and the next step
        # would check out LumeEngine's default branch instead of stopping
        run: |
          ref=$(sh gf/ci/engine-ref.sh Lume)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Lume references the engine as a local package at ../LumeEngine
      - name: LumeEngine ${{ steps.engine.outputs.ref }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ steps.engine.outputs.ref }}
          path: LumeEngine

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guide logic tests (swift test)
        working-directory: gf/guide
        run: swift test

      # Xcode 26 no longer bundles the Metal toolchain; KSPlayer's shaders need it (same as Lume's own workflow)
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Our changes onto Lume
        run: sh gf/ci/apply-patches.sh gf Lume && sh gf/ci/add-sources.sh gf Lume

      # Our patches to Lume's Swift packages (deps/): resolved into our own folder; every later xcodebuild uses it
      - name: Our patches to Lume's packages
        run: |
          echo "GF_SPM=$RUNNER_TEMP/spm" >> "$GITHUB_ENV"
          sh gf/ci/apply-dep-patches.sh gf Lume "$RUNNER_TEMP/spm"

      - name: App tests (iOS Simulator)
        run: sh gf/ci/run-app-tests.sh Lume

  build:
    name: ${{ matrix.platform }} to TestFlight
    needs: tests
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # one platform after the other, so the two uploads never create the same App Store profile at the same moment
      max-parallel: 1
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
            sdk: iphoneos
          - platform: tvOS
            destination: generic/platform=tvOS
            sdk: appletvos
    steps:
      - name: Our changes
        uses: actions/checkout@v5
        with:
          path: gf

      - name: Lume ${{ inputs.tag }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/Lume
          ref: ${{ inputs.tag }}
          path: Lume

      - name: Engine version paired with this release
        id: engine
        # two lines on purpose: inside `echo "...$(...)"` a failing engine-ref.sh would be ignored and the next step
        # would check out LumeEngine's default branch instead of stopping
        run: |
          ref=$(sh gf/ci/engine-ref.sh Lume)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Lume references the engine as a local package at ../LumeEngine
      - name: LumeEngine ${{ steps.engine.outputs.ref }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ steps.engine.outputs.ref }}
          path: LumeEngine

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Xcode 26 no longer bundles the Metal toolchain; KSPlayer's shaders need it (same as Lume's own workflow)
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Our changes onto Lume
        run: sh gf/ci/apply-patches.sh gf Lume && sh gf/ci/add-sources.sh gf Lume

      # Our patches to Lume's Swift packages (deps/): resolved into our own folder; every later xcodebuild uses it
      - name: Our patches to Lume's packages
        run: |
          echo "GF_SPM=$RUNNER_TEMP/spm" >> "$GITHUB_ENV"
          sh gf/ci/apply-dep-patches.sh gf Lume "$RUNNER_TEMP/spm"

      - name: Lume GF identity
        working-directory: Lume
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: sh ../gf/ci/gf-patch.sh "$TEAM_ID" && sh ../gf/ci/verify-patch.sh "$TEAM_ID"

      # Optional keys; each feature degrades gracefully without its key (Lume's Scripts/inject-env.sh)
      - name: Optional API keys (.env)
        working-directory: Lume
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          INTRO_DB_API_KEY: ${{ secrets.INTRO_DB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          {
            [ -n "$TMDB_ACCESS_TOKEN" ]     && echo "TMDB_ACCESS_TOKEN=$TMDB_ACCESS_TOKEN"
            [ -n "$MDBLIST_API_KEY" ]       && echo "MDBLIST_API_KEY=$MDBLIST_API_KEY"
            [ -n "$INTRO_DB_API_KEY" ]      && echo "INTRO_DB_API_KEY=$INTRO_DB_API_KEY"
            [ -n "$OPENSUBTITLES_API_KEY" ] && echo "OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY"
            [ -n "$TRAKT_CLIENT_ID" ]       && echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ]   && echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
          } > .env || true

      # Unsigned, exactly like Lume's own release builds: a signed archive would need a development certificate made on
      # the runner and, for tvOS, a registered Apple TV, and Xcode refuses ad hoc signing for iOS/tvOS. The next step puts
      # the entitlements back; the upload re-signs everything with Apple's cloud-managed distribution certificate.
      # The App Store Connect key is not on the runner yet while Lume's build scripts run.
      - name: Archive (Sideload configuration, unsigned)
        working-directory: Lume
        run: |
          xcodebuild archive \
            -project Lume.xcodeproj -scheme Lume -configuration Sideload \
            -destination '${{ matrix.destination }}' \
            -archivePath "$RUNNER_TEMP/LumeGF.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -clonedSourcePackagesDirPath "$GF_SPM" -disableAutomaticPackageResolution

      - name: Put the entitlements back (local signature)
        working-directory: Lume
        run: |
          ent() {  # the entitlements file a target uses on this platform, as Xcode resolves it
            xcodebuild -showBuildSettings -project Lume.xcodeproj -target "$1" -configuration Sideload \
              -sdk ${{ matrix.sdk }} 2>/dev/null | sed -nE 's/^ *CODE_SIGN_ENTITLEMENTS = //p' | head -1
          }
          if [ "${{ matrix.sdk }}" = iphoneos ]; then
            sh ../gf/ci/sign-local.sh "$RUNNER_TEMP/LumeGF.xcarchive" "$(ent Lume)" "LumeWidgets=$(ent LumeWidgets)"
          else
            sh ../gf/ci/sign-local.sh "$RUNNER_TEMP/LumeGF.xcarchive" "$(ent Lume)"
          fi

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc.p8" || { echo "ASC_KEY_P8 does not look like a .p8 key"; exit 1; }
          ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" python3 gf/ci/asc_dev_certs.py --check

      - name: Sign for the App Store and check the result
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed -e "s/__TEAM_ID__/$TEAM_ID/" -e "s#<string>upload</string>#<string>export</string>#" \
            gf/ci/ExportOptions-testflight.plist > "$RUNNER_TEMP/ExportOptions-check.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LumeGF.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-check.plist" \
            -exportPath "$RUNNER_TEMP/check" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          sh gf/ci/check-export.sh "$RUNNER_TEMP/check" "$TEAM_ID" ${{ matrix.platform }}

      - name: Upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" gf/ci/ExportOptions-testflight.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LumeGF.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # the same count as before the upload means no certificate was created in Georgs' account
      - name: Certificates after the upload
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: if [ -s "$RUNNER_TEMP/asc.p8" ]; then ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" python3 gf/ci/asc_dev_certs.py --check; fi

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
