name: Lume GF tests
run-name: Lume GF tests (${{ github.ref_name }} ${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Test plain Lume without our changes (diagnosis)
        type: boolean
        default: false
      only_logic:
        description: Only the logic tests (swift test) - quick, for pure-logic changes
        type: boolean
        default: false
  push:
    branches: ['part2/**', 'part3/**', 'part4/**']

permissions:
  contents: read

concurrency:
  group: lume-gf-test-${{ github.ref }}-${{ inputs.baseline && 'baseline' || (inputs.only_logic && 'logic' || 'normal') }}
  cancel-in-progress: true

jobs:
  icloud-layout:
    name: iCloud layout (development)
    runs-on: macos-26
    timeout-minutes: 15
    if: ${{ !inputs.baseline && !inputs.only_logic && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/part4/')) }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload the layout to development (needs CLOUDKIT_MANAGEMENT_TOKEN)
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$CLOUDKIT_MANAGEMENT_TOKEN" ]; then echo "iCloud layout: no CLOUDKIT_MANAGEMENT_TOKEN secret yet (Georgs adds it, Task 8)"; exit 0; fi
          xcrun cktool validate-schema --token "$CLOUDKIT_MANAGEMENT_TOKEN" --team-id "$TEAM_ID" \
            --container-id iCloud.lv.georgefeder.lume --environment development --file cloudkit/schema.ckdb
          xcrun cktool import-schema --token "$CLOUDKIT_MANAGEMENT_TOKEN" --team-id "$TEAM_ID" \
            --container-id iCloud.lv.georgefeder.lume --environment development --validate --file cloudkit/schema.ckdb
          echo "iCloud layout: uploaded to development; production needs Deploy Schema Changes once per change"
