name: Lume GF tests
run-name: Lume GF tests (${{ github.ref_name }} ${{ github.sha }})

on:
  workflow_dispatch:
  push:
    branches: ['part2/**']

permissions:
  contents: read

concurrency:
  group: lume-gf-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Guide logic (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Script tests
        run: sh ci/test_add_sources.sh
      - name: swift test
        working-directory: guide
        run: swift test
  app:
    name: App tests (iOS Simulator)
    needs: core
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Our changes
        uses: actions/checkout@v5
        with:
          path: gf
      - name: Newest Lume release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/bilipp/Lume/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Lume ${{ steps.tag.outputs.tag }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/Lume
          ref: ${{ steps.tag.outputs.tag }}
          path: Lume
      - name: Engine version paired with this release
        id: engine
        run: |
          ref=$(sh gf/ci/engine-ref.sh Lume)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: LumeEngine ${{ steps.engine.outputs.ref }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ steps.engine.outputs.ref }}
          path: LumeEngine
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Our changes onto Lume
        run: sh gf/ci/apply-patches.sh gf Lume && sh gf/ci/add-sources.sh gf Lume
      - name: App tests
        run: sh gf/ci/run-app-tests.sh Lume
