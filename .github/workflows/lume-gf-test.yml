name: Lume GF tests
run-name: Lume GF tests (${{ github.ref_name }} ${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Test plain Lume without our changes (diagnosis)
        type: boolean
        default: false
      only_logic:
        description: Only the logic tests (swift test) - quick, for pure-logic changes
        type: boolean
        default: false
  push:
    branches: ['part2/**', 'part3/**', 'part4/**']

permissions:
  contents: read

concurrency:
  group: lume-gf-test-${{ github.ref }}-${{ inputs.baseline && 'baseline' || (inputs.only_logic && 'logic' || 'normal') }}
  cancel-in-progress: true

jobs:
  core:
    name: Guide logic (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Script tests
        run: |
          sh ci/test_add_sources.sh
          sh ci/test_run_app_tests.sh
          sh ci/test_patch_scripts.sh
          sh ci/test_check_export.sh
          sh ci/test_apply_patches.sh
          sh ci/test_workflows.sh
          sh ci/test_apply_dep_patches.sh
          sh ci/test_screenshots.sh
          python3 -m unittest discover -s ci -p 'test_*.py'
      - name: swift test
        working-directory: guide
        run: swift test
      - name: iCloud layout is current
        run: |
          swift run --package-path guide gf-schema > "$RUNNER_TEMP/schema.ckdb"
          diff -u cloudkit/schema.ckdb "$RUNNER_TEMP/schema.ckdb" \
            || { echo "cloudkit/schema.ckdb is out of date: swift run --package-path guide gf-schema > cloudkit/schema.ckdb"; exit 1; }
  app:
    name: App tests (iOS Simulator)
    if: ${{ !inputs.only_logic }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Our changes
        uses: actions/checkout@v5
        with:
          path: gf
      - name: Newest Lume release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/bilipp/Lume/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Lume ${{ steps.tag.outputs.tag }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/Lume
          ref: ${{ steps.tag.outputs.tag }}
          path: Lume
      - name: Engine version paired with this release
        id: engine
        run: |
          ref=$(sh gf/ci/engine-ref.sh Lume)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: LumeEngine ${{ steps.engine.outputs.ref }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ steps.engine.outputs.ref }}
          path: LumeEngine
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Our changes onto Lume
        if: ${{ !inputs.baseline }}
        run: sh gf/ci/apply-patches.sh gf Lume && sh gf/ci/add-sources.sh gf Lume
      - name: Our patches to Lume's packages
        if: ${{ !inputs.baseline }}
        run: |
          echo "GF_SPM=$RUNNER_TEMP/spm" >> "$GITHUB_ENV"
          sh gf/ci/apply-dep-patches.sh gf Lume "$RUNNER_TEMP/spm"
      - name: App tests
        run: sh gf/ci/run-app-tests.sh Lume
      - name: tvOS compiles
        if: ${{ !inputs.baseline }}
        working-directory: Lume
        run: |
          xcodebuild build -project Lume.xcodeproj -scheme Lume -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet \
            -clonedSourcePackagesDirPath "$GF_SPM" -disableAutomaticPackageResolution
  screenshots:
    name: Screenshots (simulators)
    if: ${{ !inputs.baseline && !inputs.only_logic }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Our changes
        uses: actions/checkout@v5
        with:
          path: gf
      - name: Newest Lume release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/bilipp/Lume/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Lume ${{ steps.tag.outputs.tag }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/Lume
          ref: ${{ steps.tag.outputs.tag }}
          path: Lume
      - name: Engine version paired with this release
        id: engine
        run: |
          ref=$(sh gf/ci/engine-ref.sh Lume)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: LumeEngine ${{ steps.engine.outputs.ref }}
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ steps.engine.outputs.ref }}
          path: LumeEngine
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Our changes onto Lume
        run: sh gf/ci/apply-patches.sh gf Lume && sh gf/ci/add-sources.sh gf Lume
      - name: Our patches to Lume's packages
        run: |
          echo "GF_SPM=$RUNNER_TEMP/spm" >> "$GITHUB_ENV"
          sh gf/ci/apply-dep-patches.sh gf Lume "$RUNNER_TEMP/spm"
      - name: Screenshots (demo channels, iPhone and Apple TV)
        run: sh gf/ci/screenshots.sh Lume "$RUNNER_TEMP/screenshots"
      # what Georgs saw on build 9 (programmes beside and under the panel, the first row in the fade, a focused long
      # programme over its neighbour) must not come back
      - name: Guide checks
        run: python3 gf/ci/guide-check.py "$RUNNER_TEMP/screenshots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
