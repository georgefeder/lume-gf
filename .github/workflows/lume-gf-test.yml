name: Lume GF tests
run-name: Lume GF tests (${{ github.ref_name }} ${{ github.sha }})

on:
  workflow_dispatch:
  push:
    branches: ['part2/**']

permissions:
  contents: read

concurrency:
  group: lume-gf-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Guide logic (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Script tests
        run: sh ci/test_add_sources.sh
      - name: swift test
        working-directory: guide
        run: swift test
